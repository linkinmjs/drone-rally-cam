name: Godot Export and Upload to Itch

on: [push, pull_request]

env:
  GODOT_VERSION: "4.7"
  GODOT_STATUS: "stable"

jobs:
  import-assets:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - name: Cache import assets
        uses: actions/cache@v4
        with:
          path: godot/.godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}
      - name: Import assets
        run: godot --headless --verbose --path godot --import

  check-scenes:
    runs-on: ubuntu-latest
    needs: import-assets
    container: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: godot/.godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}
      # The import also rebuilds the global class cache, which is not part of the cache above.
      - name: Import assets
        run: godot --headless --path godot --import
      - name: Run headless checks
        run: godot --headless --path godot --fixed-fps 100 res://debug/headless_checks/check_all.tscn

  export-game:
    runs-on: ubuntu-latest
    needs: check-scenes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: godot/.godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}
      - name: Export Game using Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz"
          relative_project_path: "./godot"
          archive_output: true
          presets_to_export: "Windows Desktop,Linux"
          cache: false
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "/home/runner/.local/share/godot/archives/Windows Desktop.zip"
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: /home/runner/.local/share/godot/archives/Linux.zip

  deploy-to-itchio:
    runs-on: ubuntu-latest
    needs: export-game
    # Only publish from pushes to master, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Deploy to Itch.io (Windows)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: "Windows Desktop.zip"
      - name: Deploy to Itch.io (Linux)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: linux
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: Linux.zip
